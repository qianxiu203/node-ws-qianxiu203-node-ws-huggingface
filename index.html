<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能语音助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 还原导航站的深青色背景 */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* 防止星空超出容器 */
            background: radial-gradient(circle at center, #1a3c4a 0%, #0f171e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        /* 星空背景容器 */
        #star-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 磨砂玻璃容器 */
        .glass {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* 播放时的声波动画 */
        .wave-bar {
            width: 4px;
            height: 8px;
            background: #00d2ff;
            margin: 0 2px;
            border-radius: 2px;
            transition: all 0.2s ease;
        }
        .playing .wave-bar {
            animation: wave 1s infinite ease-in-out;
        }
        @keyframes wave {
            0%, 100% { height: 8px; }
            50% { height: 24px; }
        }

        /* 自定义滚动条 */
        textarea::-webkit-scrollbar { width: 6px; }
        textarea::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <!-- 星空背景层 -->
    <div id="star-container"></div>

    <div class="glass w-full max-w-2xl p-8 mx-4">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-wide">
                    智能文本合成
                </h1>
                <p class="text-blue-200/50 text-xs mt-1 uppercase tracking-widest">Text To Speech Engine</p>
            </div>
            <div id="visualizer" class="flex items-end h-8">
                <div class="wave-bar" style="animation-delay: 0.1s"></div>
                <div class="wave-bar" style="animation-delay: 0.2s"></div>
                <div class="wave-bar" style="animation-delay: 0.3s"></div>
                <div class="wave-bar" style="animation-delay: 0.4s"></div>
                <div class="wave-bar" style="animation-delay: 0.5s"></div>
            </div>
        </div>

        <!-- Input Section -->
        <div class="mb-6 relative">
            <textarea id="text-input" 
                class="w-full h-44 p-5 bg-black/30 border border-white/5 rounded-2xl focus:ring-1 focus:ring-blue-500/50 focus:outline-none transition-all resize-none text-gray-100 placeholder-gray-500 text-lg"
                placeholder="请输入您想要转换成语音的文字内容..."></textarea>
        </div>

        <!-- Settings Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
            <div class="space-y-3">
                <label class="block text-xs font-semibold text-blue-200/70 uppercase tracking-wider">选择语音包</label>
                <select id="voice-select" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-sm text-gray-200 focus:outline-none focus:bg-white/10 transition-all cursor-pointer">
                    <!-- 动态加载 -->
                </select>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-3">
                    <label class="block text-xs font-semibold text-blue-200/70 uppercase tracking-wider">语速 <span id="speed-val" class="ml-2 text-blue-400">1.0</span></label>
                    <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" class="w-full h-1.5 bg-white/10 rounded-lg appearance-none cursor-pointer accent-blue-500">
                </div>
                <div class="space-y-3">
                    <label class="block text-xs font-semibold text-blue-200/70 uppercase tracking-wider">音调 <span id="pitch-val" class="ml-2 text-blue-400">1.0</span></label>
                    <input type="range" id="pitch" min="0" max="2" step="0.1" value="1" class="w-full h-1.5 bg-white/10 rounded-lg appearance-none cursor-pointer accent-blue-500">
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-4">
            <button id="play-btn" class="flex-[3] bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-medium py-4 rounded-2xl shadow-lg shadow-blue-900/20 transition-all transform active:scale-[0.98] flex items-center justify-center gap-3">
                <i class="fas fa-play text-sm"></i> 立即合成并播放
            </button>
            <button id="stop-btn" class="flex-1 bg-white/5 hover:bg-red-500/20 text-white/70 hover:text-red-400 rounded-2xl transition-all flex items-center justify-center border border-white/10 group">
                <i class="fas fa-stop group-hover:scale-110 transition-transform"></i>
            </button>
        </div>
    </div>

    <script>
        // 1. 生成星空背景
        const starContainer = document.getElementById('star-container');
        const starCount = 150;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2 + 1 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
            star.style.opacity = Math.random();
            starContainer.appendChild(star);
        }

        // 2. TTS 核心逻辑
        const synth = window.speechSynthesis;
        const textInput = document.getElementById('text-input');
        const voiceSelect = document.getElementById('voice-select');
        const playBtn = document.getElementById('play-btn');
        const stopBtn = document.getElementById('stop-btn');
        const visualizer = document.getElementById('visualizer');
        const rate = document.getElementById('rate');
        const pitch = document.getElementById('pitch');

        let voices = [];

        function getVoices() {
            voices = synth.getVoices();
            voiceSelect.innerHTML = '';
            voices.forEach((voice) => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                option.setAttribute('data-name', voice.name);
                if(voice.default) option.selected = true;
                voiceSelect.appendChild(option);
            });
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = getVoices;
        }

        function speak() {
            if (synth.speaking) synth.cancel();

            if (textInput.value !== '') {
                const utterThis = new SpeechSynthesisUtterance(textInput.value);
                const selectedOption = voiceSelect.selectedOptions[0].getAttribute('data-name');
                utterThis.voice = voices.find(v => v.name === selectedOption);
                utterThis.rate = rate.value;
                utterThis.pitch = pitch.value;

                utterThis.onstart = () => {
                    visualizer.classList.add('playing');
                    playBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> 正在生成语音...';
                };

                utterThis.onend = () => {
                    visualizer.classList.remove('playing');
                    playBtn.innerHTML = '<i class="fas fa-play"></i> 立即合成并播放';
                };

                synth.speak(utterThis);
            }
        }

        playBtn.addEventListener('click', speak);
        stopBtn.addEventListener('click', () => {
            synth.cancel();
            visualizer.classList.remove('playing');
        });

        rate.addEventListener('input', () => document.getElementById('speed-val').innerText = rate.value);
        pitch.addEventListener('input', () => document.getElementById('pitch-val').innerText = pitch.value);

        getVoices();
    </script>
</body>
</html>
